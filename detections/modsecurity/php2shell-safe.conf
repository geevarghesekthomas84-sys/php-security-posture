# Defensive examples only. Review thresholds and false positives before use.
# These rules inspect request metadata and reject suspicious shapes before PHP.

SecRule ARGS_POST_NAMES "@streq PHPSESSID" \
    "id:3201001,phase:2,deny,status:403,log,msg:'PHP security: session ID in form field',tag:'php2shell',severity:CRITICAL"

SecRule MULTIPART_PART_HEADERS "@rx (?i)filename[ \\t]*=[ \\t]*[^\\r\\n]{1000,}" \
    "id:3201002,phase:2,deny,status:403,log,msg:'PHP security: oversized multipart filename',tag:'php2shell',severity:HIGH"

SecRule ARGS_NAMES "@rx ^.{1000,}$" \
    "id:3201003,phase:2,deny,status:403,log,msg:'PHP security: oversized form field name',tag:'php2shell',severity:HIGH"
