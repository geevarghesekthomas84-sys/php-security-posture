server {
    listen 80;
    root /var/www/html;
    index health.php;
    client_max_body_size 8m;
    location / { try_files $uri $uri/ /health.php; }
    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
