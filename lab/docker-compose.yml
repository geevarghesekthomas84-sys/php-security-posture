services:
  php-fpm:
    image: php:8.2.35-fpm
    container_name: php2shell-fpm
    volumes:
      - ./webroot:/var/www/html:ro
      - ./php.runtime.ini:/usr/local/etc/php/php.ini:ro
    expose: ["9000"]
    command: php-fpm -F
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: php2shell-nginx
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./webroot:/var/www/html:ro
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health.php | grep -q PHP_VERSION"]
      interval: 10s
      timeout: 5s
      retries: 5
