name: Release checks

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with:
          name: php2shell-sbom
          path: sbom/bom.json
