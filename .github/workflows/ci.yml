name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python checks
        run: python -m py_compile poc/check_php_release.py
      - name: Validate Compose file
        run: docker compose -f lab/docker-compose.yml config --quiet
